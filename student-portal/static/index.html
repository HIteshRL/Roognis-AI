<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roognis · Class 10 ICSE</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --fg:#141a2e; --muted:#657089; --line:#e6e9f2;
    --brand:#4f46e5; --brand2:#7c3aed; --accent:#4f46e5;
    --shadow:0 1px 2px rgba(20,26,46,.06), 0 8px 24px rgba(20,26,46,.06);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%, #eef1ff 0%, var(--bg) 55%);color:var(--fg);
    -webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* Header */
  header{position:sticky;top:0;z-index:20;backdrop-filter:saturate(1.4) blur(8px);
    background:rgba(255,255,255,.72);border-bottom:1px solid var(--line)}
  .hbar{display:flex;align-items:center;gap:12px;height:60px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));
    box-shadow:0 4px 12px rgba(79,70,229,.35)}
  .brand{font-weight:800;font-size:18px;letter-spacing:-.02em}
  .pill{font-size:12px;font-weight:700;color:#4338ca;background:#eef0ff;border:1px solid #e0e3ff;
    padding:4px 10px;border-radius:999px}
  .mode{margin-left:auto;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;display:flex;align-items:center;gap:7px}
  .mode.online{color:#166534;background:#e8f6ee;border:1px solid #cdebd7}
  .mode.offline{color:#8a6d00;background:#fff7e6;border:1px solid #f4e3ab}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(0,0,0,.06)}

  /* Home */
  .hero{padding:34px 0 8px}
  .hero h1{font-size:30px;letter-spacing:-.03em;margin:0 0 6px}
  .hero p{color:var(--muted);margin:0;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px;padding:22px 0 40px}
  .subject{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .16s ease, box-shadow .16s ease;overflow:hidden}
  .subject:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,26,46,.12)}
  .subject .glow{position:absolute;inset:-40% 40% auto -20%;height:120px;border-radius:50%;filter:blur(36px);opacity:.22}
  .ic{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.14)}
  .subject h3{margin:14px 0 2px;font-size:17px;letter-spacing:-.01em}
  .subject .meta{color:var(--muted);font-size:13px}
  .subject .go{position:absolute;top:18px;right:16px;color:var(--muted);font-size:18px;transition:transform .16s}
  .subject:hover .go{transform:translateX(3px);color:var(--accent)}

  /* Subject / chapter shells */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;
    background:none;border:none;padding:16px 0 0}
  .back:hover{color:var(--fg)}
  .band{display:flex;align-items:center;gap:16px;border-radius:var(--radius);padding:22px;color:#fff;margin-top:12px;
    box-shadow:var(--shadow)}
  .band .ic{background:rgba(255,255,255,.18)!important;box-shadow:none}
  .band h2{margin:0;font-size:22px;letter-spacing:-.02em}
  .band .sub{color:rgba(255,255,255,.86);font-size:13px;margin-top:2px}

  .chapters{display:flex;flex-direction:column;gap:12px;padding:20px 0 40px}
  .chapter{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .16s, transform .16s}
  .chapter:hover{box-shadow:0 10px 26px rgba(20,26,46,.10);transform:translateY(-2px)}
  .num{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;
    color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, #fff)}
  .chapter h4{margin:0;font-size:15.5px}
  .chapter .sm{color:var(--muted);font-size:13px;margin-top:2px}
  .chapter .learn{margin-left:auto;color:var(--accent);font-weight:700;font-size:13px;opacity:0;transition:opacity .16s}
  .chapter:hover .learn{opacity:1}

  /* Chat */
  .chatwrap{display:flex;flex-direction:column;height:calc(100vh - 60px)}
  .chead{border-bottom:1px solid var(--line);background:var(--card)}
  .chead .row{display:flex;align-items:center;gap:12px;padding:12px 0}
  .chead .ic{width:40px;height:40px;border-radius:12px;font-size:20px}
  .chead h3{margin:0;font-size:16px}
  .chead .sub{color:var(--muted);font-size:12.5px}
  .scope{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;padding:8px 0}
  .scope b{color:var(--fg)}
  .tag{font-size:11px;font-weight:800;color:#fff;background:var(--accent);padding:2px 9px;border-radius:7px}

  .stream{flex:1;overflow-y:auto;padding:10px 0 20px}
  .thread{display:flex;flex-direction:column;gap:16px}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--muted);padding:48px 20px}
  .empty .big{font-size:30px;margin-bottom:8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;color:#374151}
  .chip:hover{background:color-mix(in srgb, var(--accent) 8%, #fff);border-color:color-mix(in srgb,var(--accent) 35%,#fff)}

  .msg{display:flex;gap:11px;animation:rise .22s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .who{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#fff}
  .msg.user{justify-content:flex-end}
  .msg.user .bubble{background:color-mix(in srgb, var(--accent) 12%, #fff);border-color:color-mix(in srgb,var(--accent) 25%,#fff)}
  .msg.user .who{background:#64748b;order:2}
  .msg.ai .who{background:linear-gradient(135deg,var(--accent),#111827)}
  .bubble{max-width:76%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;
    font-size:14.5px;line-height:1.6;box-shadow:var(--shadow)}
  .src{margin-top:8px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .verified{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#166534;
    background:#e8f6ee;border:1px solid #cdebd7;padding:2px 8px;border-radius:999px;margin-top:8px}

  .notice{border-radius:14px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start;animation:rise .22s ease;max-width:88%}
  .notice .em{font-size:20px;line-height:1}
  .notice .t{font-size:14px;line-height:1.55}
  .notice .g{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-top:5px;opacity:.85}
  .notice.off{background:#fff7e6;border:1px solid #f4e3ab;color:#7a5b00}
  .notice.nic{background:#eef4ff;border:1px solid #d5e2fb;color:#274690}
  .notice.block{background:#fdeceb;border:1px solid #f6cfcb;color:#a12119}

  .inbar{border-top:1px solid var(--line);background:var(--card);padding:14px 0}
  .inrow{display:flex;gap:10px;align-items:center}
  .inrow input{flex:1;border:1px solid var(--line);border-radius:13px;padding:13px 15px;font-size:14.5px;font-family:inherit;
    background:#fff;outline:none}
  .inrow input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
  .send{border:none;border-radius:13px;background:var(--accent);color:#fff;font-weight:700;padding:13px 18px;font-size:14px}
  .send:disabled{opacity:.5}
  .disc{color:var(--muted);font-size:11px;text-align:center;margin-top:8px}
  .typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .hidden{display:none}
</style>
</head>
<body>
<header><div class="wrap hbar">
  <span class="logo"></span><span class="brand">Roognis</span>
  <span class="pill">Class 10 · ICSE</span>
  <span id="mode" class="mode offline"><span class="dot"></span>…</span>
</div></header>

<div id="app" class="wrap"></div>

<script>
const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const app = document.getElementById('app');
const state = { data:null, subject:null, chapter:null, student:null, conversation:null };

function shade(hex,d){const n=parseInt(hex.slice(1),16);const f=(x)=>Math.max(0,Math.min(255,x+d));
  return `rgb(${f((n>>16)&255)},${f((n>>8)&255)},${f(n&255)})`}
function setAccent(c){document.documentElement.style.setProperty('--accent',c)}

async function boot(){
  const name = localStorage.getItem('roognis_student') || 'Aarav';
  localStorage.setItem('roognis_student', name);
  const s = await fetch('/api/student/init',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name})}).then(r=>r.json());
  state.student = s.id;
  const r = await fetch('/api/curriculum'); state.data = await r.json();
  const m = document.getElementById('mode');
  m.className = 'mode ' + (state.data.online ? 'online':'offline');
  m.innerHTML = `<span class="dot"></span>${state.data.online?'Live · Groq':'Demo · offline answers'}`;
  renderHome();
}

function renderHome(){
  setAccent('#4f46e5'); state.subject=null; state.chapter=null;
  const cards = state.data.subjects.map(s=>`
    <div class="subject" data-s="${s.id}">
      <div class="glow" style="background:${s.color}"></div>
      <span class="go">›</span>
      <div class="ic" style="background:linear-gradient(135deg, ${s.color}, ${shade(s.color,-26)})">${s.icon}</div>
      <h3>${s.name}</h3>
      <div class="meta">${s.chapters.length} chapters</div>
    </div>`).join('');
  app.innerHTML = `
    <div class="hero"><h1>Hi! What will you learn today?</h1>
      <p>Pick a subject, choose a chapter, and ask your AI tutor — it answers only from that chapter's material.</p></div>
    <div class="grid">${cards}</div>`;
  app.querySelectorAll('.subject').forEach(el=>el.onclick=()=>renderSubject(el.dataset.s));
}

function renderSubject(sid){
  const s = state.data.subjects.find(x=>x.id===sid); state.subject=s; setAccent(s.color);
  const rows = s.chapters.map((c,i)=>`
    <div class="chapter" data-c="${c.id}">
      <div class="num">${i+1}</div>
      <div><h4>${c.title}</h4><div class="sm">${c.summary}</div></div>
      <span class="learn">Learn →</span>
    </div>`).join('');
  app.innerHTML = `
    <button class="back">‹ All subjects</button>
    <div class="band" style="background:linear-gradient(135deg, ${s.color}, ${shade(s.color,-30)})">
      <div class="ic">${s.icon}</div>
      <div><h2>${s.name}</h2><div class="sub">Class 10 · ICSE · ${s.chapters.length} chapters</div></div>
    </div>
    <div class="chapters">${rows}</div>`;
  app.querySelector('.back').onclick = renderHome;
  app.querySelectorAll('.chapter').forEach(el=>el.onclick=()=>renderChapter(el.dataset.c));
}

function renderChapter(cid){
  const s = state.subject; const c = s.chapters.find(x=>x.id===cid); state.chapter=c; state.conversation=null; setAccent(s.color);
  const chips = c.summary.replace(/\.$/,'').split(/,| and /).map(x=>x.trim()).filter(Boolean).slice(0,3)
    .map(x=>`<button class="chip" data-q="Explain ${x}">${x.charAt(0).toUpperCase()+x.slice(1)}</button>`).join('');
  app.innerHTML = `
   <div class="chatwrap">
    <div class="chead">
      <button class="back">‹ ${s.name}</button>
      <div class="row">
        <div class="ic" style="background:linear-gradient(135deg, ${s.color}, ${shade(s.color,-30)});color:#fff">${s.icon}</div>
        <div><h3>${c.title}</h3><div class="sub">${s.name} · Class 10 ICSE</div></div>
      </div>
      <div class="scope"><span class="tag">AI Tutor</span> Answers are grounded only in <b>${c.title}</b>. Safety &amp; subject guardrails are on.</div>
    </div>
    <div class="stream"><div class="thread" id="thread">
      <div class="empty" id="empty">
        <div class="big">💡</div><b>Ask anything about “${c.title}”.</b>
        <div style="font-size:13px;margin-top:4px">Your tutor checks the chapter before answering.</div>
        <div class="chips">${chips}</div>
      </div>
    </div></div>
    <div class="inbar"><div class="inrow">
      <input id="q" placeholder="Ask about ${c.title}…" autocomplete="off" />
      <button class="send" id="send">Send</button>
    </div><div class="disc">Roognis answers from your chapter. Verify important facts.</div></div>
   </div>`;
  app.querySelector('.back').onclick = ()=>renderSubject(s.id);
  const input = document.getElementById('q'), send = document.getElementById('send');
  const go = ()=>{ const v=input.value.trim(); if(v) ask(v); };
  send.onclick = go; input.onkeydown = e=>{ if(e.key==='Enter') go(); };
  app.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>ask(ch.dataset.q));
  input.focus();
}

function thread(){ return document.getElementById('thread'); }
function pushUser(text){
  const e=document.getElementById('empty'); if(e) e.remove();
  thread().appendChild($(`<div class="msg user"><div class="bubble">${esc(text)}</div><div class="who">You</div></div>`));
  scroll();
}
function pushTyping(){
  const el=$(`<div class="msg ai" id="typing"><div class="who">AI</div><div class="bubble typing"><span></span><span></span><span></span></div></div>`);
  thread().appendChild(el); scroll(); return el;
}
function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function scroll(){ const s=document.querySelector('.stream'); if(s) s.scrollTop=s.scrollHeight; }

async function ask(question){
  const input=document.getElementById('q'), send=document.getElementById('send');
  if(input) input.value=''; if(send) send.disabled=true;
  pushUser(question);
  const typing=pushTyping();
  try{
    const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question, subject_id:state.subject.id, chapter_id:state.chapter.id,
        student_id:state.student, conversation_id:state.conversation})});
    const d = await r.json();
    if(d.conversation_id) state.conversation = d.conversation_id;
    typing.remove();
    render(d);
  }catch(err){
    typing.remove();
    thread().appendChild($(`<div class="notice block"><div class="em">⚠️</div><div><div class="t">Something went wrong. Please try again.</div></div></div>`));
  }finally{ if(send) send.disabled=false; scroll(); if(input) input.focus(); }
}

function render(d){
  if(d.decision==='answered'){
    const src = (d.sources&&d.sources.length)? `<div class="src">📎 From ${esc(d.sources[0].title||'this chapter')}</div>`:'';
    const el=$(`<div class="msg ai"><div class="who">AI</div><div class="bubble"></div></div>`);
    thread().appendChild(el);
    typewriter(el.querySelector('.bubble'), d.answer||'', ()=>{
      el.querySelector('.bubble').insertAdjacentHTML('beforeend', src+`<div class="verified">✓ Grounded in chapter</div>`);
      scroll();
    });
    return;
  }
  const map={
    off_topic:{cls:'off',em:'↪️',g:'Subject guardrail'},
    not_in_chapter:{cls:'nic',em:'📕',g:'Not in this chapter'},
    blocked_unsafe:{cls:'block',em:'🛡️',g:'Safety guardrail'},
    pending:{cls:'off',em:'⏳',g:'Awaiting teacher approval'},
    error:{cls:'block',em:'⚠️',g:'Error'},
  }[d.decision] || {cls:'nic',em:'ℹ️',g:''};
  thread().appendChild($(`<div class="notice ${map.cls}"><div class="em">${map.em}</div>
     <div><div class="t">${esc(d.message||'')}</div><div class="g">${map.g}</div></div></div>`));
  scroll();
}

function typewriter(node, text, done){
  let i=0; const step=Math.max(2,Math.round(text.length/90));
  const t=setInterval(()=>{ i+=step; node.textContent=text.slice(0,i); scroll();
    if(i>=text.length){ clearInterval(t); node.textContent=text; done&&done(); } },16);
}

boot();
</script>
</body>
</html>

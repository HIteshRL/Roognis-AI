name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  api:
    name: API — lint, type-check, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      API_SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      GROQ_API_KEY: test-groq-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: apps/api
        run: ruff check .

      - name: Type-check (mypy)
        working-directory: apps/api
        run: mypy src --ignore-missing-imports
        continue-on-error: true

      - name: Test (pytest)
        working-directory: apps/api
        run: pytest --cov=src --cov-report=term-missing

  web:
    name: Web — lint, type-check, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Type-check
        run: npm run type-check --workspace=apps/web

      - name: Test
        run: npm run test --workspace=apps/web

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roognis · Teacher</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--fg:#141a2e;--muted:#657089;--line:#e6e9f2;--brand:#4f46e5;--brand2:#7c3aed;
    --accent:#4f46e5;--shadow:0 1px 2px rgba(20,26,46,.06),0 8px 24px rgba(20,26,46,.06);--radius:16px}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#eef1ff,var(--bg) 55%);color:var(--fg)}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .hbar{display:flex;align-items:center;gap:12px;height:60px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2))}
  .brand{font-weight:800;font-size:18px;letter-spacing:-.02em}
  .pill{font-size:12px;font-weight:700;color:#4338ca;background:#eef0ff;border:1px solid #e0e3ff;padding:4px 10px;border-radius:999px}
  .rightlink{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
  .rightlink:hover{color:var(--fg)}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:13px;padding:10px 15px}
  .btn:hover{background:#4338ca}.btn.ghost{background:transparent;color:var(--muted)}.btn.ghost:hover{background:#eef0ff}
  .btn.sm{padding:7px 11px;font-size:12px}.btn.green{background:#1e8e3e}.btn.red{background:#d93025}
  .row{display:flex;align-items:center;justify-content:space-between}
  h1{font-size:26px;letter-spacing:-.02em;margin:26px 0 2px}.sub{color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:20px 0 40px}
  .cc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s}
  .cc:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,26,46,.12)}
  .cc .ban{height:78px;padding:14px;color:#fff;position:relative}
  .cc .ban h3{margin:0;font-size:17px}.cc .ban .s{font-size:12.5px;color:rgba(255,255,255,.85)}
  .cc .mono{position:absolute;right:14px;bottom:-22px;width:48px;height:48px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:22px}
  .cc .body{padding:22px 14px 12px;color:var(--muted);font-size:12.5px;display:flex;gap:14px}
  .empty{border:1px dashed var(--line);border-radius:var(--radius);padding:50px;text-align:center;color:var(--muted)}
  .back{background:none;border:none;color:var(--muted);font-weight:600;font-size:13px;padding:18px 0 0}
  .band{display:flex;align-items:center;gap:14px;border-radius:var(--radius);padding:20px;color:#fff;margin-top:10px}
  .band .mono{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px}
  .band h2{margin:0;font-size:21px}.band .s{color:rgba(255,255,255,.85);font-size:13px}
  .code{margin-left:auto;text-align:right;background:rgba(255,255,255,.16);border-radius:10px;padding:6px 12px}
  .code .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.75)}
  .code .v{font-family:ui-monospace,Consolas,monospace;font-size:17px;font-weight:700;letter-spacing:.14em}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:20px}
  .tab{border:none;background:none;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
  .tab.on{color:var(--brand);border-color:var(--brand)}
  .pane{padding:18px 0 40px}
  .listrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
  .num{width:34px;height:34px;border-radius:10px;background:#eef0ff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800}
  .listrow h4{margin:0;font-size:15px}.listrow .m{color:var(--muted);font-size:12.5px;margin-top:2px}
  .spacer{margin-left:auto}
  .docs{margin:6px 0 0 46px;display:flex;flex-direction:column;gap:6px}
  .doc{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .stt{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
  .stt.ready{background:#e8f6ee;color:#166534}.stt.processing{background:#fff7e6;color:#8a6d00}.stt.failed{background:#fdeceb;color:#a12119}
  .person{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#111827);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;text-transform:capitalize}
  .badge.approved{background:#e8f6ee;color:#166534}.badge.pending{background:#fff7e6;color:#8a6d00}.badge.denied{background:#f0f1f5;color:#8a93a6}
  .conv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .conv:hover{box-shadow:var(--shadow)}
  .msgs{margin-top:8px;border-top:1px dashed var(--line);padding-top:10px;display:none;flex-direction:column;gap:8px}
  .mb{font-size:13px;line-height:1.5;padding:8px 11px;border-radius:10px;max-width:82%}
  .mb.user{align-self:flex-end;background:#eef0ff}.mb.ai{align-self:flex-start;background:#f5f7fb;border:1px solid var(--line)}
  .dtag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:3px}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{width:100%;max-width:440px;background:#fff;border-radius:14px}
  .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .mh h2{margin:0;font-size:17px}.mbody{padding:20px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .field label{font-size:12px;font-weight:700;color:#3c4149}
  .field input{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
  .sw{display:flex;gap:8px;flex-wrap:wrap}.swb{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer}.swb.on{outline:2px solid #111;outline-offset:2px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#141a2e;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;z-index:60}.toast.show{opacity:1}
  .hide{display:none}
  input[type=file]{display:none}
</style>
</head>
<body>
<header><div class="wrap hbar">
  <span class="logo"></span><span class="brand">Roognis</span><span class="pill">Teacher</span>
  <a class="rightlink" href="/">Student view →</a>
</div></header>
<div id="app" class="wrap"></div>
<div id="modalRoot"></div><div class="toast" id="toast"></div>

<script>
const COLORS=['#4f46e5','#1e8e3e','#e52592','#9334e6','#e8710a','#00897b','#d93025','#3949ab'];
const app=document.getElementById('app');
const $=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const api=(u,o)=>fetch(u,o).then(r=>r.ok?r.json():r.json().then(e=>Promise.reject(e)));
const teacher = localStorage.getItem('roognis_teacher') || 'Ms. Rao';
localStorage.setItem('roognis_teacher', teacher);
function toast(t){const n=document.getElementById('toast');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),1600)}
function shade(hex,d){const n=parseInt(hex.slice(1),16),f=x=>Math.max(0,Math.min(255,x+d));return `rgb(${f((n>>16)&255)},${f((n>>8)&255)},${f(n&255)})`}
function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
let state={rooms:[],room:null,tab:'chapters'};

async function home(){
  state.rooms = await api('/api/teacher/classrooms'); state.room=null;
  const cards = state.rooms.map(r=>`
    <div class="cc" data-r="${r.id}">
      <div class="ban" style="background:linear-gradient(135deg,${r.color},${shade(r.color,-30)})">
        <h3>${esc(r.name)}</h3><div class="s">${esc(r.teacher||'')}${r.seed?' · demo':''}</div>
        <div class="mono" style="background:${shade(r.color,-40)};color:#fff">${r.icon||'📘'}</div>
      </div>
      <div class="body"><span>📚 ${r.chapters.length} chapters</span><span>👥 ${(r.chapters.reduce((a,c)=>a,0),'')}</span>
        <span class="spacer" style="font-family:ui-monospace;letter-spacing:.1em">${r.join_code}</span></div>
    </div>`).join('');
  app.innerHTML=`<div class="row"><div><h1>Classes</h1><div class="sub">Create classes, add chapters, upload PDFs and review what students ask.</div></div>
     <button class="btn" id="new">＋ Create class</button></div>
     ${state.rooms.length?`<div class="grid">${cards}</div>`:`<div class="empty" style="margin-top:24px">No classes yet.</div>`}`;
  document.getElementById('new').onclick=createModal;
  app.querySelectorAll('.cc').forEach(el=>el.onclick=()=>openRoom(el.dataset.r));
}

function createModal(){
  let color=COLORS[state.rooms.length%COLORS.length];
  const m=$(`<div class="backdrop"><div class="modal">
    <div class="mh"><h2>Create class</h2><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="mbody">
      <div class="field"><label>Class name</label><input id="f_name" placeholder="e.g. Class 10 Robotics"></div>
      <div class="g2"><div class="field"><label>Subject</label><input id="f_sub" placeholder="Robotics"></div>
        <div class="field"><label>Section</label><input id="f_sec" placeholder="A"></div></div>
      <div class="field"><label>Icon (emoji)</label><input id="f_icon" placeholder="🤖" maxlength="2"></div>
      <div class="field"><label>Theme</label><div class="sw" id="sw"></div></div>
      <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="f_go">Create</button></div>
    </div></div></div>`);
  document.getElementById('modalRoot').appendChild(m);
  const sw=m.querySelector('#sw');
  COLORS.forEach(c=>{const b=document.createElement('button');b.className='swb'+(c===color?' on':'');b.style.background=c;
    b.onclick=()=>{color=c;sw.querySelectorAll('.swb').forEach(x=>x.classList.remove('on'));b.classList.add('on')};sw.appendChild(b)});
  m.querySelector('#f_go').onclick=async()=>{
    const name=m.querySelector('#f_name').value.trim(); if(!name)return;
    await api('/api/teacher/classrooms',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,subject:m.querySelector('#f_sub').value,section:m.querySelector('#f_sec').value,
      icon:m.querySelector('#f_icon').value,color,teacher})});
    closeModal();toast('Class created');home();
  };
}

async function openRoom(id){
  state.room = state.rooms.find(r=>r.id===id); state.tab='chapters'; renderRoom();
}
function renderRoom(){
  const r=state.room;
  app.innerHTML=`<button class="back" onclick="home()">‹ Classes</button>
    <div class="band" style="background:linear-gradient(135deg,${r.color},${shade(r.color,-30)})">
      <div class="mono">${r.icon||'📘'}</div><div><h2>${esc(r.name)}</h2><div class="s">${esc(r.teacher||'')}</div></div>
      <div class="code"><div class="l">Class code</div><div class="v">${r.join_code}</div></div></div>
    <div class="tabs">
      <button class="tab" data-t="chapters">Chapters</button>
      <button class="tab" data-t="students">Students</button>
      <button class="tab" data-t="insights">Student activity</button>
    </div><div class="pane" id="pane"></div>`;
  app.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{state.tab=t.dataset.t;renderRoom()});
  app.querySelector(`.tab[data-t="${state.tab}"]`).classList.add('on');
  ({chapters:paneChapters,students:paneStudents,insights:paneInsights}[state.tab])();
}

async function paneChapters(){
  const pane=document.getElementById('pane'); const r=state.room;
  const chs=await api(`/api/teacher/classrooms/${r.id}/chapters`);
  pane.innerHTML=`<div class="row" style="margin-bottom:12px"><div class="sub">${chs.length} chapters</div>
     <button class="btn sm" id="addch">＋ Add chapter</button></div><div id="chlist"></div>`;
  document.getElementById('addch').onclick=()=>addChapterModal(r.id);
  const list=document.getElementById('chlist');
  for(const [i,ch] of chs.entries()){
    const row=$(`<div><div class="listrow"><div class="num">${i+1}</div>
      <div><h4>${esc(ch.title)}</h4><div class="m">${esc(ch.summary||'')}</div></div>
      <button class="btn ghost sm spacer" data-up="${ch.id}">⬆ Upload PDF</button></div>
      <div class="docs" id="docs-${ch.id}"></div></div>`);
    list.appendChild(row);
    row.querySelector('[data-up]').onclick=()=>pickFile(ch.id);
    loadDocs(ch.id);
  }
}
function pickFile(chid){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/pdf,.pdf';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    const fd=new FormData();fd.append('file',f);
    toast('Uploading '+f.name+'…');
    try{ await api(`/api/teacher/chapters/${chid}/documents`,{method:'POST',body:fd});
      pollDocs(chid); }catch(e){toast(e.detail||'Upload failed')}
  };inp.click();
}
async function loadDocs(chid){
  const docs=await api(`/api/teacher/chapters/${chid}/documents`);
  const el=document.getElementById('docs-'+chid); if(!el)return;
  el.innerHTML=docs.map(d=>`<div class="doc">📄 ${esc(d.filename)} <span class="stt ${d.status}">${d.status}</span>
     ${d.status==='ready'?`· ${d.pages}p · ${d.chunk_count} chunks`:''}${d.error?`· ${esc(d.error)}`:''}</div>`).join('')
     || `<div class="doc" style="opacity:.6">No documents yet — upload a PDF to teach this chapter.</div>`;
}
function pollDocs(chid){let n=0;const t=setInterval(async()=>{await loadDocs(chid);n++;
  const el=document.getElementById('docs-'+chid);
  if(n>20 || (el && !el.innerHTML.includes('processing'))){clearInterval(t)}},1500);}

function addChapterModal(cid){
  const m=$(`<div class="backdrop"><div class="modal"><div class="mh"><h2>Add chapter</h2>
    <button class="btn ghost" onclick="closeModal()">✕</button></div><div class="mbody">
    <div class="field"><label>Title</label><input id="c_t" placeholder="e.g. Electromagnetism"></div>
    <div class="field"><label>Summary (optional)</label><input id="c_s" placeholder="Short description"></div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="c_go">Add</button></div>
    </div></div></div>`);
  document.getElementById('modalRoot').appendChild(m);
  m.querySelector('#c_go').onclick=async()=>{const t=m.querySelector('#c_t').value.trim();if(!t)return;
    await api(`/api/teacher/classrooms/${cid}/chapters`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:t,summary:m.querySelector('#c_s').value})});
    closeModal();toast('Chapter added');renderRoom();};
}

async function paneStudents(){
  const pane=document.getElementById('pane'); const r=state.room;
  const en=await api(`/api/teacher/classrooms/${r.id}/students`);
  pane.innerHTML=`<div class="sub" style="margin-bottom:12px">Share code <b style="font-family:ui-monospace">${r.join_code}</b> — students request to join, you approve.</div>`
    + (en.length?en.map(e=>`<div class="person"><div class="av">${(e.student_name||'?')[0].toUpperCase()}</div>
        <div><h4 style="margin:0">${esc(e.student_name)}</h4><div class="m"><span class="badge ${e.status}">${e.status}</span></div></div>
        <div class="spacer" style="display:flex;gap:6px">
          ${e.status!=='approved'?`<button class="btn green sm" data-a="approve" data-s="${e.student_id}">Approve</button>`:''}
          ${e.status!=='denied'?`<button class="btn red sm" data-a="deny" data-s="${e.student_id}">Deny</button>`:''}
        </div></div>`).join(''):`<div class="empty">No join requests yet.</div>`);
  pane.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    await api(`/api/teacher/classrooms/${r.id}/students/${b.dataset.s}/${b.dataset.a}`,{method:'POST'});
    toast('Updated');paneStudents();});
}

async function paneInsights(){
  const pane=document.getElementById('pane'); const r=state.room;
  const cs=await api(`/api/teacher/classrooms/${r.id}/conversations`);
  pane.innerHTML=`<div class="sub" style="margin-bottom:12px">Review what students are asking — every conversation is logged.</div>`
    + (cs.length?cs.map(c=>`<div class="conv" data-c="${c.id}">
        <div class="row"><b>${esc(c.student_name||'Student')}</b><span class="m" style="color:var(--muted);font-size:12px">${esc(c.chapter_title||'')} · ${c.msg_count} msgs</span></div>
        <div class="m" style="color:var(--muted);font-size:12.5px;margin-top:2px">${esc(c.title||'')}</div>
        <div class="msgs" id="m-${c.id}"></div></div>`).join(''):`<div class="empty">No student activity yet.</div>`);
  pane.querySelectorAll('.conv').forEach(el=>el.onclick=async()=>{
    const box=el.querySelector('.msgs');
    if(box.style.display==='flex'){box.style.display='none';return}
    const ms=await api(`/api/conversation/${el.dataset.c}/messages`);
    box.innerHTML=ms.map(m=>`<div class="mb ${m.role==='user'?'user':'ai'}">${esc(m.content)}
       ${m.decision?`<div class="dtag">${m.decision.replace('_',' ')}</div>`:''}</div>`).join('');
    box.style.display='flex';});
}
home();
</script>
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The application is imported as `from src...`; map it so `pip install [-e] .`
# resolves dependencies from this file instead of a drift-prone manual list.
packages = ["src"]

[project]
name = "roognis-api"
version = "0.2.0"
description = "Roognis AI — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
  # ── Phase 0.1 ────────────────────────────────────────────────────────────────
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "redis[asyncio]==5.2.1",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "httpx==0.28.1",
  "groq==0.13.0",
  "python-multipart==0.0.20",
  "structlog==24.4.0",
  "python-dotenv==1.0.1",
  # ── Phase 0.2 — Document Parsing ─────────────────────────────────────────────
  "pypdf==5.1.0",
  "python-docx==1.1.2",
  "python-pptx==1.0.2",
  "markdown==3.7",
  "beautifulsoup4==4.12.3",
  "aiofiles==24.1.0",
  # ── Phase 0.2 — Chunking ─────────────────────────────────────────────────────
  "tiktoken==0.8.0",
  # ── Phase 0.2 — Embeddings ───────────────────────────────────────────────────
  "fastembed==0.4.1",
  "openai==1.59.5",
  # ── Phase 0.2 — Vector Database ──────────────────────────────────────────────
  "qdrant-client==1.12.1",
  # ── Phase 0.0 — Observability ────────────────────────────────────────────────
  "prometheus-fastapi-instrumentator==7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "httpx==0.28.1",
  "factory-boy==3.3.1",
  "ruff==0.8.4",
  "mypy==1.13.0",
]
# ── v0.71 — self-hosted LTX-Video (needs a CUDA GPU). Install with:
#   pip install -e '.[video]'
# Image generation (Fal) needs no extra deps — it uses the base httpx client.
video = [
  "torch>=2.4",
  "diffusers>=0.32",
  "transformers>=4.44",
  "accelerate>=1.0",
  "imageio[ffmpeg]>=2.36",
  "sentencepiece>=0.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
  "N818",
  "E501",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: calling Depends()/Query()/etc in argument defaults is correct,
# not a mutable-default bug. Whitelist them so B008 doesn't fire.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"src/infrastructure/database/migrations/*" = ["E501"]
"src/infrastructure/database/models/*" = ["E501"]
# Test fixtures set os.environ before importing app modules — imports can't be at top.
"tests/conftest.py" = ["E402"]
"tests/api/test_rag_routes.py" = ["E402"]

[tool.mypy]
# The app is imported as `from src...`, and the editable install also exposes
# `src` as a top-level package. Pin the base to this dir so `mypy src` resolves
# every file as `src.<module>` (one name), avoiding "found twice" clashes.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

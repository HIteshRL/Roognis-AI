[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roognis-api"
version = "0.1.0"
description = "Roognis AI — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "redis[asyncio]==5.2.1",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==3.2.2",
  "httpx==0.28.1",
  "groq==0.13.0",
  "python-multipart==0.0.20",
  "structlog==24.4.0",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "httpx==0.28.1",
  "factory-boy==3.3.1",
  "ruff==0.8.4",
  "mypy==1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
  "N818",   # DomainException naming — intentional domain pattern
  "E501",   # Line length — handled per-file where unavoidable (migrations, ORM relationships)
]

[tool.ruff.lint.per-file-ignores]
"src/infrastructure/database/migrations/*" = ["E501"]
"src/infrastructure/database/models/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

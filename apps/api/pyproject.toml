[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roognis-api"
version = "0.2.0"
description = "Roognis AI — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
  # ── Phase 0.1 ────────────────────────────────────────────────────────────────
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "redis[asyncio]==5.2.1",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==3.2.2",
  "httpx==0.28.1",
  "groq==0.13.0",
  "python-multipart==0.0.20",
  "structlog==24.4.0",
  "python-dotenv==1.0.1",
  # ── Phase 0.2 — Document Parsing ─────────────────────────────────────────────
  "pypdf==5.1.0",
  "python-docx==1.1.2",
  "python-pptx==1.0.2",
  "markdown==3.7",
  "beautifulsoup4==4.12.3",
  "aiofiles==24.1.0",
  # ── Phase 0.6 — Vision OCR (image normalisation for scanned docs) ─────────────
  "pillow==11.0.0",
  # ── Phase 0.2 — Chunking ─────────────────────────────────────────────────────
  "tiktoken==0.8.0",
  # ── Phase 0.2 — Embeddings ───────────────────────────────────────────────────
  "fastembed==0.4.1",
  "openai==1.59.5",
  # ── Phase 0.2 — Vector Database ──────────────────────────────────────────────
  "qdrant-client==1.12.1",
  # ── Phase 0.0 — Observability ────────────────────────────────────────────────
  "prometheus-fastapi-instrumentator==7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "httpx==0.28.1",
  "factory-boy==3.3.1",
  "ruff==0.8.4",
  "mypy==1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
  "N818",
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"src/infrastructure/database/migrations/*" = ["E501"]
"src/infrastructure/database/models/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
